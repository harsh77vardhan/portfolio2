<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harsh Singh — AI Engineer & Product Builder</title>
  
  <!-- SEO & Social Graph Meta Tags -->
  <meta name="description" content="Personal portfolio of Harsh Singh. First-year AI & ML student at VIT Bhopal building real products from idea to production." />
  <meta name="keywords" content="Harsh Singh, AI Engineer, Full Stack Developer, Product Builder, VIT Bhopal, Technea, React, FastAPI, Gemini API" />
  <meta name="author" content="Harsh Singh" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Harsh Singh — AI Engineer & Product Builder" />
  <meta property="og:description" content="I build products from idea to production. First-year AIML student at VIT Bhopal." />
  <meta property="og:image" content="assets/images/bg.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Harsh Singh — AI Engineer & Product Builder" />
  <meta name="twitter:description" content="I build products from idea to production. First-year AIML student at VIT Bhopal." />
  <meta name="twitter:image" content="assets/images/bg.jpg" />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Accessible Skip Link -->
  <a href="#hero" class="skip-link">Skip to main content</a>

  <!-- Background Video Stage -->
  <div class="bg-stage" id="bg-stage">
    <video class="bg-video" id="bg-video" autoplay muted loop playsinline preload="auto" poster="assets/images/bg-poster.jpg">
      <source src="assets/video/bg-loop.webm" type="video/webm">
      <source src="assets/video/bg-loop.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Atmospheric Soft Background Overlay -->
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Minimal Transparent Header -->
  <header class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="#hero" class="brand-link" aria-label="Harsh Singh Home">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Harsh Singh</span>
      </a>

      <nav class="nav-menu" id="nav-menu" aria-label="Primary Navigation">
        <a href="#about" class="nav-link">About</a>
        <a href="#work" class="nav-link">Work</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main id="main-content">
    <!-- Hero Section -->
    <section id="hero" class="hero-section">
      <div class="container">
        <div id="hero-content-container"></div>
      </div>
      <a href="#about" class="hero-scroll-indicator" aria-label="Scroll to About section">
        <span>Scroll</span>
        <span class="scroll-line" aria-hidden="true"></span>
      </a>
    </section>

    <!-- About Section -->
    <section id="about" class="section">
      <div class="container">
        <div id="about-content-container"></div>
      </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="section">
      <div class="container">
        <div id="skills-content-container"></div>
      </div>
    </section>

    <!-- Work Section -->
    <section id="work" class="section">
      <div class="container">
        <div id="work-content-container"></div>
      </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section">
      <div class="container">
        <div id="contact-content-container"></div>
      </div>
    </section>
  </main>

  <!-- Minimal Footer -->
  <footer class="footer" id="footer">
    <div class="container">
      <div id="footer-content-container" class="footer-content"></div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
